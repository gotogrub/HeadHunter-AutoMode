version: '3.8'

services:
  hh-destroyer:
    build: .
    container_name: hh-destroyer
    restart: unless-stopped
    volumes:
      - ./browser_data:/app/browser_data
      - ./logs:/app/logs
    environment:
      - HH_SERVER_MODE=true
      - HH_BROWSER=chromium
      # Telegram bot (опционально)
      # - TELEGRAM_BOT_TOKEN=your_token_here
      # - TELEGRAM_OWNER_ID=your_id_here
      # AI (опционально - Ollama)
      # - OLLAMA_HOST=http://ollama:11434
      # - OLLAMA_MODEL=llama2
      # AI (опционально - OpenAI)
      # - OPENAI_API_KEY=sk-...
      # - OPENAI_MODEL=gpt-3.5-turbo
    command: python main.py --daemon --browser chromium
    depends_on:
      - ollama
    networks:
      - hh-network

  # Ollama для AI-генерации писем (опционально)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - hh-network

networks:
  hh-network:
    driver: bridge

volumes:
  ollama_data:
